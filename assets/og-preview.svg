<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="spaceGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    <radialGradient id="sunGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#ef4444" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#spaceGrad)"/>
  <circle cx="160" cy="315" r="320" fill="url(#sunGlow)"/>

  <!-- Orbits -->
  <ellipse cx="160" cy="315" rx="360" ry="140" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.4"/>
  <ellipse cx="160" cy="315" rx="540" ry="210" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.3"/>
  <ellipse cx="160" cy="315" rx="760" ry="290" fill="none" stroke="#0284c7" stroke-width="1.5" opacity="0.25"/>

  <!-- Celestial Bodies -->
  <circle cx="160" cy="315" r="70" fill="#f59e0b"/>
  <circle cx="520" cy="245" r="22" fill="#38bdf8"/>
  <circle cx="700" cy="380" r="16" fill="#ef4444"/>
  <circle cx="920" cy="220" r="48" fill="#d97706"/>
  <ellipse cx="920" cy="220" rx="90" ry="26" fill="none" stroke="#fcd34d" stroke-width="6" opacity="0.8" transform="rotate(-15 920 220)"/>

  <!-- Spaceship Icon -->
  <g transform="translate(680, 240) rotate(-25) scale(2.2)">
    <path d="M0 -20 L10 12 L0 8 L-10 12 Z" fill="#38bdf8"/>
    <path d="M-10 12 L-20 20 L-10 16 Z" fill="#0284c7"/>
    <path d="M10 12 L20 20 L10 16 Z" fill="#0284c7"/>
    <path d="M-4 16 L0 26 L4 16 Z" fill="#f97316"/>
  </g>

  <!-- Typography -->
  <text x="100" y="480" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="800" fill="url(#titleGrad)" letter-spacing="2">AstroVoyager 3D</text>
  <text x="100" y="535" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="600" fill="#cbd5e1">Simulasi Penerbangan Antariksa dan Edukasi Astronomi Tata Surya</text>
  <text x="100" y="575" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">WebGL &amp; Three.js - 8 Planet, Sabuk Asteroid, Misi Penjelajahan, dan Kuis Sains Interaktif</text>
</svg>
